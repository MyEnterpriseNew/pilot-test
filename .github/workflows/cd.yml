name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Package
        run: |
          mvn dependency:get \
            -DrepoUrl=https://maven.pkg.github.com/jogeshrajput/pilot-test \
            -Dartifact=com.example:pilot-test:1.0.1

      - name: Deploy to Linux Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: ~/.m2/repository/com/example/pilot-test/1.0.1/*
          target: /apps/pilot-test/
